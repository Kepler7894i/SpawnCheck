name: Release

# Every push to main (or to a supported/<version> maintenance branch, see CONTRIBUTING.md) publishes (or refreshes) a release for the Minecraft version in gradle.properties.
# Release tag == Minecraft version (the value of minecraftVersion in gradle.properties), so the latest release for any Minecraft version can always be
# found and downloaded later, even after main has moved on to a newer Minecraft version.
#   - If the project builds, the Fabric and NeoForge jars are attached.
#   - If it does not build (e.g. mid-port to a new Minecraft version), the release still contains the
#     version-specific source snapshot so that state can be recovered.
# To release a change, bump `version` in gradle.properties.

on:
  push:
    branches: [main, 'supported/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Builds releases for GitHub and publishes the jars to Modrinth and CurseForge
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the previous commit is needed to tell whether `version` was bumped

      # Publish to Modrinth/CurseForge only for a new mod version: those sites refuse (or duplicate) a version that already exists.
      - name: Decide whether to publish
        id: gate
        run: |
          publish=false
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            [ "${{ inputs.publish }}" = true ] && publish=true
          else
            before="${{ github.event.before }}"
            now=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
            if [ -z "$before" ] || [ -z "${before//0/}" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              publish=true   # a new branch or an unreachable previous commit: treat as new
            else
              old=$(git show "$before:gradle.properties" 2>/dev/null | grep -E '^version=' | cut -d= -f2 | tr -d '\r ')
              [ "$old" != "$now" ] && publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publish to Modrinth/CurseForge: $publish"

      - name: Read versions
        id: v
        run: |
          mc=$(grep -E '^minecraftVersion=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          ver=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # README.md is generated from README.template.md ({{minecraftVersion}} etc. come from gradle.properties).
      # If the rendered result differs from what is committed, commit it (a GITHUB_TOKEN push does not re-trigger this workflow).
      - name: Render README
        run: |
          java tools/RenderReadme.java
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Render README for Minecraft ${{ steps.v.outputs.mc }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || { git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; }
          fi

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        id: build
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew build --no-daemon --console=plain

      - name: Collect files
        run: |
          mkdir -p out
          git archive --format=zip --prefix="spawncheck-${{ steps.v.outputs.mc }}-source/" \
            -o "out/spawncheck-${{ steps.v.outputs.mc }}-source.zip" HEAD
          cp install-windows.ps1 install-linux.sh install-macos.sh out/
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp fabric/build/libs/spawncheck-fabric-*.jar out/ || true
            cp neoforge/build/libs/spawncheck-neoforge-*.jar out/ || true
            rm -f out/*-sources.jar
          fi
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          mc="${{ steps.v.outputs.mc }}"
          ver="${{ steps.v.outputs.ver }}"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            status="Built from commit ${sha}."
          else
            status="The build failed for commit ${sha}, so only the source snapshot and scripts are attached."
          fi
          cat > notes.md <<'NOTES'
          Spawn Check @VER@ for **Minecraft @MC@**: shows where mobs will actually spawn, and why they won't where they don't. Install it on the server as well as the client.

          **Files**
          - `spawncheck-fabric-@MC@-@VER@.jar`: Fabric (needs Fabric API)
          - `spawncheck-neoforge-@MC@-@VER@.jar`: NeoForge
          - `install-windows.ps1`, `install-linux.sh`, `install-macos.sh`: installers for Windows, Linux and macOS (on Fabric they also install Fabric API if your `mods` folder has none; options in the README)
          - `spawncheck-@MC@-source.zip`: the exact source for this Minecraft version

          **Install:** put the jar for your loader (and, on Fabric, Fabric API) in your `mods` folder, or run `install-windows.ps1` (Windows), `./install-linux.sh` (Linux) or `./install-macos.sh` (macOS) from the folder containing the jars. Add `-Loader neoforge` / `--loader neoforge` for NeoForge. Point the output at another folder (e.g. a server's `mods` folder) with `-ModsDir "<folder>"` (install-windows.ps1) or `--mods-dir <folder>` (install-linux.sh, install-macos.sh). Add `-NoDeps` / `--no-deps` to skip installing Fabric API.

          @STATUS@ This release is updated by every push to main while main targets Minecraft @MC@.
          NOTES
          sed -i -e 's/^          //' -e "s|@MC@|$mc|g" -e "s|@VER@|$ver|g" -e "s|@STATUS@|$status|g" notes.md
          # Replace the previous release/tag for this Minecraft version with the current state.
          gh release delete "$mc" --cleanup-tag --yes 2>/dev/null || true
          # Only main (the newest Minecraft version) is marked Latest; maintenance branches never take it over.
          latest=true; [ "${{ github.ref_name }}" = main ] || latest=false
          gh release create "$mc" out/* --target "$sha" --title "Spawn Check $mc" --notes-file notes.md --latest=$latest

      - name: Write changelog
        if: steps.build.outcome == 'success' && steps.gate.outputs.publish == 'true'
        run: |
          {
            echo "Spawn Checker ${{ steps.v.outputs.ver }} for Minecraft ${{ steps.v.outputs.mc }}."
            echo
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ -n "${before//0/}" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              git log --no-merges --format='- %s' "$before..HEAD" | grep -v 'Render README' || true
            else
              git log -1 --format='- %s'
            fi
          } > changelog.md
          cat changelog.md

      # One Modrinth version carries all three loaders' jars.
      - name: Publish to Modrinth
        if: steps.build.outcome == 'success' && steps.gate.outputs.publish == 'true' && env.MODRINTH_TOKEN != '' && env.MODRINTH_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: |
            out/spawncheck-fabric-*.jar
            out/spawncheck-neoforge-*.jar
            out/spawncheck-forge-*.jar
          name: Spawn Checker ${{ steps.v.outputs.ver }} for Minecraft ${{ steps.v.outputs.mc }}
          version: ${{ steps.v.outputs.ver }}+${{ steps.v.outputs.mc }}
          version-type: release
          changelog-file: changelog.md
          loaders: |
            fabric
            neoforge
            forge
          game-versions: ${{ steps.v.outputs.mc }}
          dependencies: |
            fabric-api(required)

      # CurseForge takes one loader per file, so each jar is its own upload.
      - name: Publish Fabric to CurseForge
        if: steps.build.outcome == 'success' && steps.gate.outputs.publish == 'true' && env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: out/spawncheck-fabric-*.jar
          name: Spawn Checker ${{ steps.v.outputs.ver }} (Fabric ${{ steps.v.outputs.mc }})
          version: ${{ steps.v.outputs.ver }}+${{ steps.v.outputs.mc }}
          version-type: release
          changelog-file: changelog.md
          loaders: fabric
          game-versions: ${{ steps.v.outputs.mc }}
          dependencies: |
            fabric-api(required)

      - name: Publish NeoForge to CurseForge
        if: steps.build.outcome == 'success' && steps.gate.outputs.publish == 'true' && env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: out/spawncheck-neoforge-*.jar
          name: Spawn Checker ${{ steps.v.outputs.ver }} (NeoForge ${{ steps.v.outputs.mc }})
          version: ${{ steps.v.outputs.ver }}+${{ steps.v.outputs.mc }}
          version-type: release
          changelog-file: changelog.md
          loaders: neoforge
          game-versions: ${{ steps.v.outputs.mc }}

      - name: Publish Forge to CurseForge
        if: steps.build.outcome == 'success' && steps.gate.outputs.publish == 'true' && env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: out/spawncheck-forge-*.jar
          name: Spawn Checker ${{ steps.v.outputs.ver }} (Forge ${{ steps.v.outputs.mc }})
          version: ${{ steps.v.outputs.ver }}+${{ steps.v.outputs.mc }}
          version-type: release
          changelog-file: changelog.md
          loaders: forge
          game-versions: ${{ steps.v.outputs.mc }}

      - name: Note skipped platforms
        if: steps.gate.outputs.publish == 'true'
        run: |
          [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_ID" ] || echo "::notice::Modrinth skipped: set the MODRINTH_TOKEN secret and the MODRINTH_ID variable."
          [ -n "$CURSEFORGE_TOKEN" ] && [ -n "$CURSEFORGE_ID" ] || echo "::notice::CurseForge skipped: set the CURSEFORGE_TOKEN secret and the CURSEFORGE_ID variable."
