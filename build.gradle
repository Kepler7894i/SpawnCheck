plugins {
	id 'net.fabricmc.fabric-loom' version "${loomVersion}"
}

base {
	// spawncheck-fabric-<minecraft version>-<mod version>.jar
	archivesName = "spawncheck-fabric-${project.minecraftVersion}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"spawncheck" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// All versions come from gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraftVersion}"
	implementation "net.fabricmc:fabric-loader:${project.fabricLoaderVersion}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}+${project.minecraftVersion}"
}

processResources {
	def modVersion = project.version
	def minecraftVersion = project.minecraftVersion
	def fabricLoaderVersion = project.fabricLoaderVersion
	inputs.property "version", modVersion
	inputs.property "minecraftVersion", minecraftVersion
	inputs.property "fabricLoaderVersion", fabricLoaderVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion, "minecraftVersion": minecraftVersion, "fabricLoaderVersion": fabricLoaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	// Minecraft 26.x needs Java 25.
	it.options.release = 25
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
