org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Single source of truth for the mod version and the Minecraft version it targets. The mod metadata (fabric.mod.json),
# jar names, release tag/name/notes, install scripts and README are all derived from these values.
# To retarget another Minecraft version run: java tools/SetVersion.java <minecraft version>

# Mod
version=1.0.0
group=dev.spawncheck

# Target
minecraftVersion=26.2
fabricLoaderVersion=0.19.5
fabricApiVersion=0.161.0

# Build tooling (not tied to a Minecraft version)
loomVersion=1.18.2
